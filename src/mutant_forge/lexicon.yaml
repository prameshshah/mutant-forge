# Solver messages we recognize, one row each. Add a row only for a message seen in
# real output, and set `source` to what prints it: the file:line at MOOSE commit
# c2dfd9fe, or the PETSc 3.25.2 message format and the option that turns it on.
#
# role: context (marks an attempt), failure (a cause), downstream (a consequence),
#       terminal (the last line, where the run gives up)
# token: the word a correct answer must quote; {reason} means the PETSc reason code

rows:
  - id: time_step_header
    pattern: '^Time Step \d+, time = \S+, dt = \S+$'
    component: time_stepper
    role: context
    symptom: null
    token: Time Step
    source: 'framework/src/outputs/Console.C:435 (dt at line 445)'

  - id: linear_not_converged
    pattern: '^Linear solve did not converge due to \w+ iterations \d+$'
    component: linear_solver
    role: failure
    symptom: null
    token: "{reason}"
    source: 'PETSc 3.25.2 "Linear solve did not converge due to %s iterations %ld" (-ksp_converged_reason, which MOOSE adds as ::failed in framework/src/utils/PetscSupport.C:832-845)'

  - id: nonlinear_not_converged
    pattern: '^Nonlinear solve did not converge due to \w+ iterations \d+$'
    component: nonlinear_solver
    role: failure
    symptom: null
    token: "{reason}"
    source: 'PETSc 3.25.2 "Nonlinear solve did not converge due to %s iterations %ld" (-snes_converged_reason, which MOOSE adds as ::failed in framework/src/utils/PetscSupport.C:832-845)'

  - id: solve_did_not_converge
    pattern: '^Solve Did NOT Converge!$'
    component: time_stepper
    role: downstream
    symptom: null
    token: Did NOT Converge
    source: 'framework/src/executioners/FEProblemSolve.C:505'

  - id: aborting
    pattern: '^Aborting as solve did not converge$'
    component: time_stepper
    role: downstream
    symptom: null
    token: Aborting
    source: 'framework/src/executioners/TransientBase.C:511 (steady runs: SteadyBase.C:74)'

  # The same line as `aborting`, but as the last line of a run with no time steps: a
  # Steady run stops here when its solve does not converge. In a Transient run the line
  # is followed by a smaller step, so it stays downstream there. Seen first in specs
  # f4-diff2ds-1 to -8 (issue #17).
  - id: solve_aborted_terminal
    pattern: '^Aborting as solve did not converge$'
    component: nonlinear_solver
    role: terminal
    symptom: solve_aborted
    token: Aborting
    source: 'framework/src/executioners/SteadyBase.C:74 (printed, then the steady loop stops)'
    steady_end: true

  - id: dtmin_terminal
    pattern: '^Solve failed and timestep already at or below dtmin, cannot continue!$'
    component: time_stepper
    role: terminal
    symptom: timestep_at_or_below_dtmin
    token: dtmin
    source: 'framework/src/timesteppers/TimeStepper.C:210 (mooseError)'
