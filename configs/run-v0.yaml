  - {id: f4-diff2ds-1, base: diff2ds, fault: F4, params: {nx: 4, ny: 4}}
  - {id: f4-diff2ds-2, base: diff2ds, fault: F4, params: {nx: 5, ny: 5}}
  - {id: f4-diff2ds-3, base: diff2ds, fault: F4, params: {nx: 3, ny: 3}}
  - {id: f4-diff2ds-4, base: diff2ds, fault: F4, params: {nx: 11, ny: 11}}
  - {id: f4-diff2ds-5, base: diff2ds, fault: F4, params: {nx: 15, ny: 15}}
  - {id: f4-diff2ds-6, base: diff2ds, fault: F4, params: {nx: 16, ny: 16}}
  - {id: f4-diff2ds-7, base: diff2ds, fault: F4, params: {nx: 8, ny: 8}}
  - {id: f4-diff2ds-8, base: diff2ds, fault: F4, params: {nx: 6, ny: 6}}
