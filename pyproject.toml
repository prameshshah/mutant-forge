[project]
name = "mutant-forge"
version = "0.1.0"
description = "Draft MOOSE diagnosis cases from injected faults"
readme = "README.md"
authors = [
    { name = "Pramesh Shah", email = "93220122+prameshshah@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
mutant-forge = "mutant_forge.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "moose: needs the pinned MOOSE build ($MF_MOOSE_EXE)",
    "bench: needs the benchmark checkout ($MF_BENCH_DIR)",
    "api: needs ANTHROPIC_API_KEY (pass it with uv run --env-file .env)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
